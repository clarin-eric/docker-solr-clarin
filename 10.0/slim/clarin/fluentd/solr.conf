<source>
  @type tail
  path /var/log/supervisord/solr.log
  pos_file /var/log/fluentd/solr.log.pos
  tag solr
  emit_unmatched_lines true
  <parse>
    @type regexp
    # expression rewritten for the Solr 10 log format; the regex was generated with Claude Opus 5.5
    # and tested against Solr 10.0.0 log lines from the VLO cores.
    # Changes compared to the Solr 8.11 expression:
    #   - Solr 10 no longer logs "webapp=/solr", which the old expression required, so request
    #     lines did not match anymore; the solr_webapp field is no longer extracted
    #   - solr_index is now taken from the "x:<core>" entry in the bracketed log context
    #     (8.11: "[vlo-index]  webapp=/solr ...", 10: "[ x:vlo-index t:null-3] ...")
    #   - path, params, hits, status and QTime are each optional, in this order
    #   - message now holds the full text after the log context (8.11: only text after QTime)
    # Example lines (Solr 10):
    #   2026-10-13 13:55:50.882 INFO  (qtp425015667-84-null-3) [ x:vlo-index t:null-3] o.a.s.c.S.Request path=/select params={q=*:*} hits=0 status=0 QTime=41
    #   2026-10-13 13:55:51.003 INFO  (qtp425015667-52-null-6) [ x:vlo-index t:null-6] o.a.s.u.p.LogUpdateProcessorFactory path=/update params={commit=true}{add=[...], commit=} 0 76
    # Update lines end in "<status> <QTime>" without labels, so solr_status and solr_qtime stay
    # empty for them (same as with the 8.11 expression).
    expression /^((?<log_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+(?<log_level>\S+)\s+(\([^)]*\)\s+\[(?:[^\]]*?\bx:(?<solr_index>[^\s\]]+))?[^\]]*\]\s+)?)?(?<message>(.*?path=(?<solr_path>\S+))?(.*?params=(?<solr_params>\{[^}]*\}))?(.*?hits=(?<solr_hits>\d+))?(.*?status=(?<solr_status>\d+))?(.*?QTime=(?<solr_qtime>\d+))?.*)$/
    types solr_hits:integer,solr_status:integer,solr_qtime:integer
  </parse>
</source>

<source>
  @type tail
  path /var/log/supervisord/solr-err.log
  pos_file /var/log/fluentd/solr-err.log.pos
  tag solr_err
  emit_unmatched_lines true
  <parse>
    @type none
  </parse>
</source>

